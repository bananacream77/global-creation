<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deefy — 딥페이크 탐지</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #e8f4fc;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .nav {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 3rem;
      font-weight: 700;
      color: #2563eb;
    }

    .tagline {
      font-size: 1.2rem;
      color: #333;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
    }

    .btn-primary {
      background-color: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background-color: #1e4ed8;
    }

    .btn-sub {
      background-color: white;
      border: 1.5px solid #2563eb;
      color: #2563eb;
    }

    .btn-sub:hover {
      background-color: #eff6ff;
    }
  </style>
</head>
<body>
  <div class="nav">
    <button class="btn-sub" onclick="alert('로그인 기능은 아직 준비 중입니다.')">로그인</button>
  </div>

  <div class="intro-container">
    <div class="logo-box">
      <div class="logo">Deefy</div>
      <div class="tagline">AI 기반 딥페이크 탐지 시스템</div>
    </div>
    <button class="btn-primary" id="startBtn">Get Started →</button>
    <button class="btn-sub" onclick="alert('Pro 버전은 추후 공개 예정입니다.')">
      업무용 Deefy Pro 사용해보기 →
    </button>
  </div>

  <script>
    document.getElementById("startBtn").addEventListener("click", function() {
      window.location.href = "analyze.html";
    });
  </script>
</body>
</html>
