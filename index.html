<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deefy - AI 기반 딥페이크 탐지 시스템</title>
  <style>
    /* 기본 스타일 */
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background-color: #e8f2fb;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* 우측 상단 로그인 버튼 */
    .login-top-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      padding: 10px 25px;
      border: 1.8px solid #2563eb;
      background-color: transparent;
      color: #2563eb;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .login-top-btn:hover {
      background-color: #2563eb;
      color: white;
    }

    /* 중앙 메인 */
    .main-title {
      font-size: 70px;
      color: #2563eb;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .sub-title {
      font-size: 20px;
      color: #444;
      margin-bottom: 40px;
    }

    /* 버튼 그룹 */
    .btn-group {
      display: flex;
      gap: 15px;
    }

    .btn-primary {
      padding: 14px 30px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #1e4ed8;
    }

    .btn-outline {
      padding: 14px 30px;
      border: 1.8px solid #2563eb;
      color: #2563eb;
      background-color: transparent;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }

    .btn-outline:hover {
      background-color: #dbeafe;
    }

    /* 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content h2 {
      margin-bottom: 20px;
      color: #222;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .modal-content input:focus {
      border-color: #2563eb;
      outline: none;
    }

    .modal-content button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.25s;
    }

    .modal-content button:hover {
      background-color: #1e4ed8;
    }

    .close-btn {
      background-color: #e5e7eb;
      color: #333;
      margin-top: 10px;
    }

    .close-btn:hover {
      background-color: #d1d5db;
    }
  </style>
</head>
<body>
  <!-- 로그인 버튼 -->
  <button class="login-top-btn" id="openLoginBtn">로그인</button>

  <!-- 메인 섹션 -->
  <div class="main">
    <h1 class="main-title">Deefy</h1>
    <p class="sub-title">AI 기반 딥페이크 탐지 시스템</p>
    <div class="btn-group">
      <button class="btn-primary">Get Started →</button>
      <button class="btn-outline">업무용 Deefy Pro 사용해보기 →</button>
    </div>
  </div>

  <!-- 로그인 모달 -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>로그인</h2>
      <input type="email" placeholder="이메일 입력" />
      <input type="password" placeholder="비밀번호 입력" />
      <button>로그인</button>
      <button class="close-btn" id="closeLoginBtn">닫기</button>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById("openLoginBtn");
    const closeBtn = document.getElementById("closeLoginBtn");
    const modal = document.getElementById("loginModal");

    openBtn.addEventListener("click", () => {
      modal.style.display = "flex";
    });

    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    window.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });
  </script>
</body>
</html>
