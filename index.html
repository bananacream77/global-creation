<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deefy — 딥페이크 탐지</title>

  <style>
    body {
      margin: 0;
      background-color: #e8f4fc;
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .nav {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .intro-container {
      text-align: center;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 40px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
    }

    .btn-primary {
      background-color: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background-color: #1e4ed8;
    }

    .btn-sub {
      background-color: white;
      border: 1.5px solid #2563eb;
      color: #2563eb;
    }

    .btn-sub:hover {
      background-color: #eff6ff;
    }
  </style>
</head>
<body>
  <div class="nav">
    <button class="btn-sub" onclick="alert('로그인 기능은 아직 준비 중입니다.')">로그인</button>
  </div>

  <div class="intro-container">
    <div class="logo">Deefy</div>
    <div class="tagline">AI 기반 딥페이크 탐지 시스템</div>
    <button class="btn-primary" id="startBtn">Get Started →</button>
    <button class="btn-sub" onclick="alert('Pro 버전은 추후 공개 예정입니다.')">
      업무용 Deefy Pro 사용해보기 →
    </button>
  </div>

  <script>
    document.getElementById("startBtn").addEventListener("click", function() {
      window.location.href = "analyze.html";
    });
  </script>
  <!-- LOGIN BUTTON (페이지 상단 등 원하는 위치에 넣기) -->
<button id="loginBtn" class="btn" style="margin-left:12px;">로그인</button>

<!-- LOGIN MODAL (body 끝에 추가) -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:9999;">
  <div style="width:360px;background:#fff;padding:20px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);">
    <h3 style="margin:0 0 8px 0;">로그인</h3>
    <div style="margin-bottom:10px;">
      <input id="loginId" placeholder="아이디" style="width:100%;padding:10px;border:1px solid #e6e9ef;border-radius:8px;" />
    </div>
    <div style="margin-bottom:14px;">
      <input id="loginPw" placeholder="비밀번호" type="password" style="width:100%;padding:10px;border:1px solid #e6e9ef;border-radius:8px;" />
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="loginCancel" class="btn" style="background:#eee;color:#222;border:none;">취소</button>
      <button id="loginSubmit" class="btn">로그인</button>
    </div>
    <p style="font-size:12px;color:#6b7280;margin-top:10px;">(데모) 아이디: <code>user</code>, 비밀번호: <code>pass</code></p>
  </div>
</div>

<script>
  // ---- 모의 로그인 (클라이언트에서 처리) ----
  const loginBtn = document.getElementById('loginBtn');
  const loginModal = document.getElementById('loginModal');
  const loginCancel = document.getElementById('loginCancel');
  const loginSubmit = document.getElementById('loginSubmit');

  loginBtn.addEventListener('click', ()=> loginModal.style.display = 'flex');
  loginCancel.addEventListener('click', ()=> loginModal.style.display = 'none');

  // 로그인 성공시 토큰 저장 & UI 변경
  function onLoginSuccess(token, username){
    // 예: 로컬스토리지에 JWT 저장
    localStorage.setItem('fd_token', token);
    localStorage.setItem('fd_user', username);
    loginModal.style.display = 'none';
    // 로그인 상태 반영 (예: 버튼 텍스트 변경)
    loginBtn.textContent = username + ' 님 (로그아웃)';
    loginBtn.onclick = logout;
    alert('로그인 성공 (데모): ' + username);
  }

  function logout(){
    localStorage.removeItem('fd_token');
    localStorage.removeItem('fd_user');
    loginBtn.textContent = '로그인';
    loginBtn.onclick = ()=> loginModal.style.display = 'flex';
    location.reload();
  }

  // 초기 상태 반영
  const existingUser = localStorage.getItem('fd_user');
  if (existingUser){
    loginBtn.textContent = existingUser + ' 님 (로그아웃)';
    loginBtn.onclick = logout;
  } else {
    loginBtn.onclick = ()=> loginModal.style.display = 'flex';
  }

  // 실제 로그인 버튼 동작: 데모 검증 (아이디=user, pw=pass)
  loginSubmit.addEventListener('click', ()=>{
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value.trim();
    // 데모용 검증: user / pass
    if (id === 'user' && pw === 'pass'){
      // 데모 토큰(실제로는 서버에서 발급)
      const demoToken = 'demo.jwt.token';
      onLoginSuccess(demoToken, id);
    } else {
      alert('로그인 실패: 아이디/비밀번호가 올바르지 않습니다.');
    }
  });
</script>

</body>
</html>
