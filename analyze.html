<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deefy — 딥페이크 탐지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="analyze">
  <header>
    <h1>Deefy — 딥페이크 탐지</h1>
    <p>영상 업로드 후 AI가 진위확률을 판단합니다.</p>
  </header>

  <main class="analyze-box">
    <div class="upload-box">
      <p>파일을 드래그하거나 클릭하여 업로드하세요</p>
      <small>MP4, MOV, WEBM 등 (최대 100MB 권장)</small>
      <input type="file" id="fileInput" accept="video/*" />
      <button class="btn-primary">분석 시작</button>
      <div class="preview">미리보기가 여기에 표시됩니다</div>
    </div>

    <div class="result-box">
      <h2>분석 결과</h2>
      <p>아직 분석이 이루어지지 않았습니다.</p>
    </div>
  </main>

  <footer>
    <p>© Team Global Creation — GitHub Pages / 실제 분석은 서버 연동 필요</p>
  </footer>
</body>
</html>
