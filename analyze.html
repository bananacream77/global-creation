<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deefy — 딥페이크 탐지</title>

  <!-- 스타일 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="analyze">
  <header>
    <h1>Deefy — 딥페이크 탐지</h1>
    <p>영상 업로드 후 AI가 진위 여부를 판정합니다.</p>
  </header>

  <main class="analyze-box">
    <!-- 업로드 구역 -->
    <section class="upload-box">
      <h2>파일 업로드</h2>
      <input type="file" id="fileInput" accept="video/*,image/*" />
      <div class="preview" id="preview">미리보기가 여기에 표시됩니다</div>
      <button class="btn-primary" id="analyzeBtn" disabled>분석 시작</button>
      <p class="status" id="status">대기 중</p>
    </section>

    <!-- 결과 구역 -->
    <section class="result-box">
      <h2>분석 결과</h2>
      <div id="resultArea" style="color:#64748b;">아직 분석이 이루어지지 않았습니다.</div>
    </section>
  </main>

  <footer>
    © Team Global Creation — Deefy AI 딥페이크 탐지 시스템
  </footer>

  <script>
    // 파일 입력 및 미리보기
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');

    let currentFile = null;

    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    function handleFile(file) {
      if (!file) return;
      currentFile = file;
      analyzeBtn.disabled = false;
      status.textContent = `파일 준비됨 · ${Math.round(file.size / 1024)} KB`;

      preview.innerHTML = '';
      const url = URL.createObjectURL(file);

      if (file.type.startsWith('video')) {
        const v = document.createElement('video');
        v.src = url;
        v.controls = true;
        v.muted = true;
        v.playsInline = true;
        preview.appendChild(v);
      } else if (file.type.startsWith('image')) {
        const img = document.createElement('img');
        img.src = url;
        preview.appendChild(img);
      } else {
        preview.textContent = '미리보기 불가한 파일입니다';
      }
    }

    analyzeBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      analyzeBtn.disabled = true;
      status.textContent = '분석 중...';
      resultArea.textContent = '';

      await sleep(800); // 모의 분석 대기

      // 가짜 확률 임의로 생성 (데모용)
      const fakeProbability = Math.round((0.1 + Math.random() * 0.8) * 100);
      const isFake = fakeProbability > 50;

      showResult({
        prediction: fakeProbability / 100,
        label: isFake ? 'fake' : 'real',
      });

      analyzeBtn.disabled = false;
      status.textContent = '완료';
    });

    function showResult(data) {
      const pct = Math.round(data.prediction * 100);
      const labelText = data.label === 'fake' ? '⚠️ 가짜일 가능성 높음' : '✅ 진짜일 가능성 높음';
      resultArea.innerHTML = `
        <div style="font-size:1.5rem; font-weight:700;">${pct}%</div>
        <div style="margin-top:6px;">${labelText}</div>
      `;
    }

    function sleep(ms) {
      return new Promise(res => setTimeout(res, ms));
    }
  </script>
</body>
</html>
